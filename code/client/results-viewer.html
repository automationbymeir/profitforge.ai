      }

      }

        text-align: center;
        padding: 60px 20px;
        color: #666;
        font-size: 1.2em;
      }

        content: '...';
        animation: dots 1.5s steps(4, end) infinite;
      }
      @keyframes dots {
        0%,
        20% {
          content: '.';
        }
        40% {
          content: '..';
        }
        60%,
        100% {
          content: '...';
        }

      .confidence-score-value {

      }
      .confidence-score-value.high {

      }

      }
      .confidence-score-value.low {

      .modal-overlay {

        text-align: right;
      }
      .explanation-box {
        background: #e7f3ff;
        border-left: 4px solid #0078d4;
        padding: 15px 20px;
        margin: 15px 0;
        border-radius: 4px;
        font-size: 0.95em;
        line-height: 1.6;
      }
      .explanation-box strong {
        color: #0078d4;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="test-client.html">📤 Upload</a>
        <a href="results-viewer.html" class="active">📊 Results</a>
      </div>
    </div>
    <div>
      <h1>ProfitForge.ai - Results Viewer</h1>
      <p class="subtitle">Product Catalog Extraction Results with Version History</p>

      <div class="controls">
        <div class="form-group">
          <label for="resultId">Result ID (optional)</label>
          <input type="text" id="resultId" placeholder="Enter UUID" />
        </div>
        <div class="form-group">
          <label for="vendor">Vendor Name (optional)</label>
          <input type="text" id="vendor" placeholder="e.g., Hatteras" />
        </div>
        <button onclick="loadResults()">Load Results</button>
      </div>

      <div id="content">
        <div class="empty-state">
          <h3>👆 Enter parameters and click "Load Results"</h3>
          <p>View processed documents and extracted product catalogs</p>
        </div>
      </div>
    </div>

    <script>
      let activeRuns = {}; // Track active run per vendor

      // Auto-detect function app URL from current hostname
      function getFunctionAppUrl() {
        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        const port = window.location.port;

        // If localhost, use local function app with port 7071
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
          return 'http://localhost:7071';
        }

        // Otherwise, use same host as current page (function app serves the HTML)
        return port ? `${protocol}//${hostname}:${port}` : `${protocol}//${hostname}`;
      }

      async function loadResults() {
        const content = document.getElementById('content');
        const baseUrl = getFunctionAppUrl();
        const resultId = document.getElementById('resultId').value.trim();
        const vendor = document.getElementById('vendor').value.trim();

        let url = `${baseUrl}/api/documents?limit=10`;
        if (resultId) url += `&resultId=${encodeURIComponent(resultId)}`;
        if (vendor) url += `&vendor=${encodeURIComponent(vendor)}`;

        content.innerHTML = '<div class="loading">Loading results</div>';

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

          const results = await response.json();

          if (results.length === 0) {
            content.innerHTML = `<div class="empty-state"><h3>No results found</h3><p>Try adjusting your filters or upload a new document</p></div>`;
            return;
          }

          // Group results by vendor_name
          const grouped = {};
          results.forEach((result) => {
            const vendor = result.vendor_name;
            if (!grouped[vendor]) grouped[vendor] = [];
            grouped[vendor].push(result);
          });

          // Sort each vendor's runs by created_at DESC (most recent first)
          Object.values(grouped).forEach((runs) => {
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          });

          // Render grouped cards (sorted by most recent run's timestamp)
          const vendorGroups = Object.entries(grouped).sort(
            (a, b) => new Date(b[1][0].created_at) - new Date(a[1][0].created_at)
          );

          content.innerHTML = vendorGroups
            .map(([vendor, runs]) => renderVendorCard(runs, baseUrl))
            .join('');
        } catch (error) {
          content.innerHTML = `<div class="error"><strong>Error loading results:</strong><br/>${error.message}</div>`;
        }
      }

      function renderVendorCard(runs, baseUrl) {
        const vendor = runs[0].vendor_name;
        const activeRunId = activeRuns[vendor] || runs[0].result_id;
        const activeRun = runs.find((r) => r.result_id === activeRunId) || runs[0];

        return `
          <div class="results-card" id="vendor-${vendor}">
            <div class="card-header">
              <div class="card-header-content">
                <h2>${vendor}</h2>
                <div class="card-meta">📄 ${activeRun.document_name} • ${runs.length} processing run${runs.length > 1 ? 's' : ''}</div>
              </div>
              <div class="action-buttons-vendor">
                <button class="secondary small" onclick="uploadBenchmark('${vendor}')">📊 Upload Benchmark</button>
                ${activeRun.processing_status === 'completed' || activeRun.processing_status === 'ocr_complete' ? `<button class="secondary" onclick="rerunAI('${vendor}')">🔄 Rerun AI</button>` : ''}
                <button class="danger" onclick="deleteDocument('${activeRun.result_id}')">🗑️ Delete All</button>
              </div>
            </div>
            <div class="card-body">
              ${renderRunCarousel(runs, vendor, activeRunId)}
              <div id="run-details-${vendor}">
                ${renderRunDetails(activeRun, baseUrl)}
              </div>
            </div>
          </div>
        `;
      }

      function renderRunCarousel(runs, vendor, activeRunId) {
        return `
          <div class="run-carousel">
            <div class="run-carousel-header">
              <span class="run-carousel-title">📊 Processing Runs (${runs.length})</span>
            </div>
            <div class="run-list">
              ${runs.map((run, index) => renderRunCard(run, vendor, activeRunId, index === 0)).join('')}
            </div>
          </div>
        `;
      }

      function renderRunCard(run, vendor, activeRunId, isLatest) {
        const isActive = run.result_id === activeRunId;
        const confidence = run.ai_confidence_score || 0;
        const products = run.ai_mapping_result
          ? (typeof run.ai_mapping_result === 'string'
              ? JSON.parse(run.ai_mapping_result)
              : run.ai_mapping_result
            ).products || []
          : [];

        return `
          <div class="run-card ${isActive ? 'active' : ''}" onclick="selectRun('${vendor}', '${run.result_id}')">
            <div class="run-card-header">
              <span class="run-number">${new Date(run.created_at).toLocaleDateString()} ${new Date(run.created_at).toLocaleTimeString()}</span>
              ${isLatest ? '<span class="run-badge">Latest</span>' : ''}
            </div>
            <div class="run-stats">
              <div>📦 ${products.length} products</div>
              <div>💰 $${((run.ai_model_cost_usd || 0) + (run.doc_intel_cost_usd || 0)).toFixed(4)}</div>
              <div>🎯 ${confidence.toFixed(0)}% confidence</div>
              <div><span class="status ${run.processing_status}">${run.processing_status}</span></div>
            </div>
            <div class="confidence-bar"><div class="confidence-fill ${getConfidenceClass(confidence)}" style="width: ${confidence}%"></div></div>
          </div>
        `;
      }

      function selectRun(vendor, runId) {
        activeRuns[vendor] = runId;
        loadResults(); // Reload to update UI
      }

      function renderRunDetails(result, baseUrl) {
        let mappingResult = null;
        if (result.ai_mapping_result) {
          mappingResult =
            typeof result.ai_mapping_result === 'string'
              ? JSON.parse(result.ai_mapping_result)
              : result.ai_mapping_result;
        } else {
          mappingResult = result.ai_mapping_result;
        }

        const products = mappingResult?.products || [];
        const qualityMetrics = mappingResult?.qualityMetrics || {};
        const statusClass = result.processing_status || 'pending';
        const confidenceScore = result.ai_confidence_score || qualityMetrics.confidenceScore || 0;
        const completenessScore =
          result.ai_completeness_score || qualityMetrics.completenessScore || 0;

        return `
              <div class="info-grid">
                <div class="info-item">
                  <span class="info-label">Status</span>
                  <span class="info-value"><span class="status ${statusClass}">${result.processing_status}</span></span>
                </div>
                <div class="info-item">
                  <span class="info-label">Export Status</span>
                  <span class="info-value"><span class="status ${result.export_status || 'pending'}">${result.export_status || 'pending'}</span></span>
                </div>
                <div class="info-item">
                  <span class="info-label">AI Confidence</span>
                  <span class="info-value"><span class="confidence-score-value ${getConfidenceClass(confidenceScore)}">${confidenceScore.toFixed(1)}%</span></span>
                  <div class="confidence-bar"><div class="confidence-fill ${getConfidenceClass(confidenceScore)}" style="width: ${confidenceScore}%"></div></div>
                </div>
                <div class="info-item">
                  <span class="info-label">Completeness</span>
                  <span class="info-value"><span class="confidence-score-value ${getConfidenceClass(completenessScore)}">${completenessScore.toFixed(1)}%</span></span>
                  <div class="confidence-bar"><div class="confidence-fill ${getConfidenceClass(completenessScore)}" style="width: ${completenessScore}%"></div></div>
                </div>
                <div class="info-item">
                  <span class="info-label">AI Model</span>
                  <span class="info-value">${result.ai_model_used || 'N/A'}</span>
                </div>
                <div class="info-item">
                  <span class="info-label">OCR Cost</span>
                  <span class="info-value">$${(result.doc_intel_cost_usd || 0).toFixed(4)}</span>
                </div>
                <div class="info-item">
                  <span class="info-label">AI Cost</span>
                  <span class="info-value">$${(result.ai_model_cost_usd || 0).toFixed(4)}</span>
                </div>
              </div>

              <div class="action-buttons">
                ${result.processing_status === 'completed' && result.export_status !== 'confirmed' && result.export_status !== 'exported' ? `<button class="success" onclick="confirmMapping('${result.result_id}')">✓ Confirm & Export</button>` : ''}
                ${result.export_status === 'confirmed' || result.export_status === 'exported' ? `<span class="status confirmed" style="padding: 10px 20px;">✓ Exported</span>` : ''}
                ${
                  result.grading_results && result.graded_at
                    ? `
                  <button class="secondary small" onclick="viewGradingResults('${result.result_id}')">📊 View Benchmark Grades</button>
                  <button class="secondary small" onclick="downloadGradingResults('${result.result_id}', '${result.vendor_name}')">⬇️ Download Grades</button>
                `
                    : ''
                }
                <button class="danger small" onclick="deleteRun('${result.result_id}')">🗑️ Delete This Run</button>
              </div>

              <div id="grade-results-${result.result_id}"></div>

              ${
                products.length > 0
                  ? `
                <details style="margin-top: 20px;">
                  <summary style="cursor: pointer; font-weight: 600; padding: 10px; background: #f0f0f0; border-radius: 4px; user-select: none;">📦 Extracted Products (${products.length} items)</summary>
                  <div style="margin-top: 15px; max-height: 500px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 4px;">
                    <table class="products-table">
                      <thead style="position: sticky; top: 0; background: white; z-index: 1;">
                        <tr>${getAllFieldNames(products)
                          .map((field) => `<th>${formatFieldName(field)}</th>`)
                          .join('')}</tr>
                      </thead>
                      <tbody>
                        ${products
                          .map((p) => {
                            const fields = getAllFieldNames(products);
                            return `<tr>${fields
                              .map((field) => {
                                const value = p[field];
                                if (value === null || value === undefined) {
                                  return '<td><span style="color: #999;">-</span></td>';
                                } else if (typeof value === 'number') {
                                  // Check if it's a price field
                                  if (
                                    field.toLowerCase().includes('price') ||
                                    field.toLowerCase().includes('cost')
                                  ) {
                                    return `<td><span class="product-price">$${value.toFixed(2)}</span></td>`;
                                  }
                                  return `<td>${value}</td>`;
                                } else {
                                  return `<td>${value}</td>`;
                                }
                              })
                              .join('')}</tr>`;
                          })
                          .join('')}
                      </tbody>
                    </table>
                  </div>
                </details>
              `
                  : `<div class="empty-state" style="margin-top: 20px;">
                      <h3>No products extracted</h3>
                      <p>${result.processing_status === 'completed' ? 'Document processed but no products found' : 'Processing not yet complete'}</p>
                    </div>`
              }
        `;
      }

      function getConfidenceClass(score) {
        if (score >= 80) return 'high';
        if (score >= 60) return 'medium';
        return 'low';
      }

      // Get all unique field names from products array
      function getAllFieldNames(products) {
        const fieldSet = new Set();
        products.forEach((product) => {
          Object.keys(product).forEach((key) => fieldSet.add(key));
        });

        // Convert to array and prioritize common fields first
        const fields = Array.from(fieldSet);
        const priority = ['sku', 'product_name', 'name', 'price', 'unit', 'description'];

        return fields.sort((a, b) => {
          const aIndex = priority.indexOf(a.toLowerCase());
          const bIndex = priority.indexOf(b.toLowerCase());

          if (aIndex !== -1 && bIndex !== -1) return aIndex - bIndex;
          if (aIndex !== -1) return -1;
          if (bIndex !== -1) return 1;
          return a.localeCompare(b);
        });
      }

      // Format field name for display (convert snake_case to Title Case)
      function formatFieldName(fieldName) {
        return fieldName
          .split('_')
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');
      }

      window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const resultId = params.get('resultId');
        const vendor = params.get('vendor');
        if (resultId) document.getElementById('resultId').value = resultId;
        if (vendor) document.getElementById('vendor').value = vendor;
        if (resultId || vendor) loadResults();
      });

      async function rerunAI(vendorName) {
        if (
          !confirm(
            `Rerun AI mapping for ${vendorName}? This will create a new processing run using the existing OCR data.`
          )
        ) {
          return;
        }

        const baseUrl = getFunctionAppUrl();

        try {
          const response = await fetch(
            `${baseUrl}/api/documents/${encodeURIComponent(vendorName)}/process-ai-mapping`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
            }
          );

          const data = await response.json();
          if (response.ok) {
            alert(`✅ AI reprocessing started for ${vendorName}! New run created.`);
            loadResults();
          } else {
            alert(`❌ Error: ${data.error || JSON.stringify(data.details || data)}`);
          }
        } catch (error) {
          alert(`❌ Network error: ${error.message}`);
        }
      }

      async function confirmMapping(documentId) {
        if (!confirm('Export products to production catalog? This action cannot be undone.'))
          return;
        const baseUrl = getFunctionAppUrl();
        try {
          const response = await fetch(`${baseUrl}/api/documents/runs/${documentId}/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
          });
          const data = await response.json();
          if (response.ok) {
            alert(
              `✅ Success! ${data.productsExported} products exported to ${data.vendor} catalog.`
            );
            loadResults();
          } else {
            alert(`❌ Error: ${data.error || JSON.stringify(data)}`);
          }
        } catch (error) {
          alert(`❌ Network error: ${error.message}`);
        }
      }

      async function deleteRun(runId) {
        if (!confirm('Delete this specific run version? This cannot be undone.')) return;
        const baseUrl = getFunctionAppUrl();
        try {
          const response = await fetch(
            `${baseUrl}/api/documents/runs/${encodeURIComponent(runId)}`,
            { method: 'DELETE' }
          );
          const data = await response.json();
          if (response.ok) {
            alert(`✅ ${data.message}`);
            loadResults();
          } else {
            alert(`❌ Error: ${data.error}`);
          }
        } catch (error) {
          alert(`❌ Network error: ${error.message}`);
        }
      }

      async function deleteDocument(resultId) {
        if (
          !confirm(
            'Delete ALL versions of this document? This will remove all processing runs and the original file. This cannot be undone.'
          )
        )
          return;
        const baseUrl = getFunctionAppUrl();

        // First, get the vendor name for this result
        try {
          const resultResponse = await fetch(`${baseUrl}/api/documents?resultId=${resultId}`);
          const results = await resultResponse.json();
          if (!results || results.length === 0) {
            alert('❌ Error: Could not find result');
            return;
          }
          const vendorName = results[0].vendor_name;

          // Now delete the vendor document
          const response = await fetch(
            `${baseUrl}/api/documents/${encodeURIComponent(vendorName)}`,
            { method: 'DELETE' }
          );
          const data = await response.json();
          if (response.ok) {
            alert(`✅ ${data.message}`);
            loadResults();
          } else {
            alert(`❌ Error: ${data.error}`);
          }
        } catch (error) {
          alert(`❌ Network error: ${error.message}`);
        }
      }

      async function uploadBenchmark(vendorName) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx,.xls';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const baseUrl = getFunctionAppUrl();
          const formData = new FormData();
          formData.append('file', file);
          formData.append('vendorName', vendorName);

          try {
            const response = await fetch(`${baseUrl}/api/documents/benchmark`, {
              method: 'POST',
              body: formData,
            });
            const data = await response.json();
            if (response.ok) {
              alert(
                `✅ Benchmark uploaded successfully!\n${data.productCount} products loaded for ${vendorName}`
              );
              loadResults();
            } else {
              alert(`❌ Error: ${data.error || data.message}`);
            }
          } catch (error) {
            alert(`❌ Network error: ${error.message}`);
          }
        };
        input.click();
      }

      async function viewBenchmark(vendorName) {
        const baseUrl = getFunctionAppUrl();
        try {
          const response = await fetch(
            `${baseUrl}/api/documents/benchmark/${encodeURIComponent(vendorName)}`
          );
          if (response.status === 404) {
            alert(
              `ℹ️ No benchmark found for ${vendorName}\n\nClick "📊 Upload Benchmark" to upload one.`
            );
            return;
          }
          const data = await response.json();
          if (response.ok) {
            const products = data.products || [];
            const uploadedAt = new Date(data.uploadedAt).toLocaleString();
            const details = products
              .slice(0, 10)
              .map((p) => `• ${p.sku}: ${p.product_name} - $${p.price}`)
              .join('\n');
            const more = products.length > 10 ? `\n... and ${products.length - 10} more` : '';
            alert(
              `📊 Benchmark for ${vendorName}\n\nUploaded: ${uploadedAt}\nProducts: ${products.length}\n\n${details}${more}`
            );
          } else {
            alert(`❌ Error: ${data.error || data.message}`);
          }
        } catch (error) {
          alert(`❌ Network error: ${error.message}`);
        }
      }

      async function gradeRun(runId, vendorName) {
        const baseUrl = getFunctionAppUrl();
        const gradeContainer = document.getElementById(`grade-results-${runId}`);
        gradeContainer.innerHTML = '<div class="loading">Grading run against benchmark</div>';

        try {
          const response = await fetch(
            `${baseUrl}/api/documents/runs/${encodeURIComponent(runId)}/grade`
          );
          const data = await response.json();

          if (response.status === 404) {
            gradeContainer.innerHTML = `
              <div class="benchmark-card">
                <h4>⚠️ No Benchmark Available</h4>
                <p>Upload a benchmark Excel file for ${vendorName} to enable grading.</p>
                <button class="secondary small" onclick="uploadBenchmark('${vendorName}')" style="margin-top: 10px;">📊 Upload Benchmark</button>
              </div>
            `;
            return;
          }

          if (!response.ok) {
            gradeContainer.innerHTML = `<div class="error">❌ Error: ${data.error || data.message}</div>`;
            return;
          }

          const f1Class = getGradeClass(data.f1Score);
          const precisionClass = getGradeClass(data.precision);
          const recallClass = getGradeClass(data.recall);

          gradeContainer.innerHTML = `
            <div class="grade-card">
              <h4>🎯 Benchmark Grading Results</h4>
              
              <div class="grade-metrics">
                <div class="grade-metric">
                  <div class="grade-metric-label">F1 Score</div>
                  <div class="grade-metric-value ${f1Class}">${data.f1Score.toFixed(1)}%</div>
                </div>
                <div class="grade-metric">
                  <div class="grade-metric-label">Precision</div>
                  <div class="grade-metric-value ${precisionClass}">${data.precision.toFixed(1)}%</div>
                </div>
                <div class="grade-metric">
                  <div class="grade-metric-label">Recall</div>
                  <div class="grade-metric-value ${recallClass}">${data.recall.toFixed(1)}%</div>
                </div>
              </div>

              <div class="info-grid">
                <div class="info-item">
                  <span class="info-label">Benchmark Products</span>
                  <span class="info-value">${data.benchmarkProductCount}</span>
                </div>
                <div class="info-item">
                  <span class="info-label">Extracted Products</span>
                  <span class="info-value">${data.extractedProductCount}</span>
                </div>
                <div class="info-item">
                  <span class="info-label">Matched Products</span>
                  <span class="info-value">${data.matchedProductCount}</span>
                </div>
              </div>

              <div class="grade-details">
                <div class="grade-section">
                  <h5>Field Accuracy</h5>
                  <div class="info-grid">
                    <div class="info-item">
                      <span class="info-label">SKU</span>
                      <span class="info-value ${getGradeClass(data.fieldAccuracy.sku)}">${data.fieldAccuracy.sku.toFixed(1)}%</span>
                    </div>
                    <div class="info-item">
                      <span class="info-label">Name</span>
                      <span class="info-value ${getGradeClass(data.fieldAccuracy.name)}">${data.fieldAccuracy.name.toFixed(1)}%</span>
                    </div>
                    <div class="info-item">
                      <span class="info-label">Price</span>
                      <span class="info-value ${getGradeClass(data.fieldAccuracy.price)}">${data.fieldAccuracy.price.toFixed(1)}%</span>
                    </div>
                    <div class="info-item">
                      <span class="info-label">Unit</span>
                      <span class="info-value ${getGradeClass(data.fieldAccuracy.unit)}">${data.fieldAccuracy.unit.toFixed(1)}%</span>
                    </div>
                    <div class="info-item">
                      <span class="info-label">Description</span>
                      <span class="info-value ${getGradeClass(data.fieldAccuracy.description)}">${data.fieldAccuracy.description.toFixed(1)}%</span>
                    </div>
                  </div>
                </div>

                ${
                  data.missingSkus.length > 0
                    ? `
                  <div class="grade-section">
                    <h5>⚠️ Missing SKUs (${data.missingSkus.length})</h5>
                    <div class="sku-list">
                      ${data.missingSkus.map((sku) => `<span class="sku-badge missing">${sku}</span>`).join('')}
                    </div>
                  </div>
                `
                    : ''
                }

                ${
                  data.extraSkus.length > 0
                    ? `
                  <div class="grade-section">
                    <h5>ℹ️ Extra SKUs (${data.extraSkus.length})</h5>
                    <div class="sku-list">
                      ${data.extraSkus.map((sku) => `<span class="sku-badge extra">${sku}</span>`).join('')}
                    </div>
                  </div>
                `
                    : ''
                }
              </div>
            </div>
          `;
        } catch (error) {
          gradeContainer.innerHTML = `<div class="error">❌ Network error: ${error.message}</div>`;
        }
      }

      function getGradeClass(score) {
        if (score >= 90) return 'excellent';
        if (score >= 75) return 'good';
        if (score >= 60) return 'fair';
        return 'poor';
      }

      // View grading results for a specific run
      async function viewGradingResults(runId) {
        const baseUrl = getFunctionAppUrl();

        try {
          const response = await fetch(
            `${baseUrl}/api/documents?resultId=${encodeURIComponent(runId)}`
          );

          if (!response.ok) {
            alert('Failed to load run data');
            return;
          }

          const results = await response.json();
          if (!results || results.length === 0) {
            alert('Run not found');
            return;
          }

          const runData = results[0];

          if (!runData.grading_results || !runData.grading_analysis) {
            alert('No grading results available for this run');
            return;
          }

          const metrics = JSON.parse(runData.grading_results);
          const analysis = JSON.parse(runData.grading_analysis);

          // Populate modal with grading results
          const modalBody = document.getElementById('gradingModalBody');
          modalBody.innerHTML = `
            <div class="modal-meta">
              <div class="modal-meta-grid">
                <div>
                  <div class="info-label">Run ID</div>
                  <div class="info-value">${runId.substring(0, 13)}</div>
                </div>
                <div>
                  <div class="info-label">Vendor</div>
                  <div class="info-value">${runData.vendor_name}</div>
                </div>
                <div>
                  <div class="info-label">Document</div>
                  <div class="info-value">${runData.document_name}</div>
                </div>
                <div>
                  <div class="info-label">Graded At</div>
                  <div class="info-value">${new Date(runData.graded_at).toLocaleString()}</div>
                </div>
              </div>
            </div>

            <!-- Overall Metrics -->
            <div class="modal-section">
              <h3><span>📈</span> Overall Performance Metrics</h3>
              <div class="metrics-grid">
                <div class="metric-card">
                  <div class="metric-label">Accuracy</div>
                  <div class="metric-value ${getMetricClass(metrics.accuracy)}">${metrics.accuracy.toFixed(1)}%</div>
                  <div class="metric-explanation">How well extracted data matches benchmark overall</div>
                </div>
                <div class="metric-card">
                  <div class="metric-label">Precision</div>
                  <div class="metric-value ${getMetricClass(metrics.precision)}">${metrics.precision.toFixed(1)}%</div>
                  <div class="metric-explanation">Percentage of extracted products that are correct</div>
                </div>
                <div class="metric-card">
                  <div class="metric-label">Recall</div>
                  <div class="metric-value ${getMetricClass(metrics.recall)}">${metrics.recall.toFixed(1)}%</div>
                  <div class="metric-explanation">Percentage of benchmark products that were found</div>
                </div>
                <div class="metric-card">
                  <div class="metric-label">F1 Score</div>
                  <div class="metric-value ${getMetricClass(metrics.f1Score)}">${metrics.f1Score.toFixed(1)}%</div>
                  <div class="metric-explanation">Harmonic mean of precision and recall</div>
                </div>
              </div>
              
              <div class="explanation-box">
                <strong>What do these metrics mean?</strong><br>
                • <strong>Accuracy</strong> = Overall correctness of extracted data across all fields<br>
                • <strong>Precision</strong> = Of all products extracted, what % are actually real products from the benchmark<br>
                • <strong>Recall</strong> = Of all products in the benchmark, what % were successfully extracted<br>
                • <strong>F1 Score</strong> = Balance between precision and recall (higher is better)
              </div>
            </div>

            <!-- Product Matching Statistics -->
            <div class="modal-section">
              <h3><span>📦</span> Product Matching Statistics</h3>
              <div style="background: white; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px;">
                <div class="stats-row">
                  <div class="stats-label">Total Benchmark Products</div>
                  <div class="stats-value">${metrics.totalBenchmarkProducts}</div>
                </div>
                <div class="stats-row">
                  <div class="stats-label">Total Extracted Products</div>
                  <div class="stats-value">${metrics.totalExtractedProducts}</div>
                </div>
                <div class="stats-row">
                  <div class="stats-label">✅ Correct Matches (≥90% match)</div>
                  <div class="stats-value" style="color: #28a745;">${metrics.correctMatches}</div>
                </div>
                <div class="stats-row">
                  <div class="stats-label">⚠️ Partial Matches (50-90% match)</div>
                  <div class="stats-value" style="color: #ffc107;">${metrics.partialMatches}</div>
                </div>
                <div class="stats-row">
                  <div class="stats-label">❌ Missed Products (not found)</div>
                  <div class="stats-value" style="color: #dc3545;">${metrics.missedProducts}</div>
                </div>
                <div class="stats-row">
                  <div class="stats-label">🚫 False Positives (shouldn't exist)</div>
                  <div class="stats-value" style="color: #dc3545;">${metrics.falsePositives}</div>
                </div>
              </div>
              
              <div class="explanation-box">
                <strong>Understanding Product Matching:</strong><br>
                • <strong>Correct Matches</strong>: Products that match the benchmark very closely (90%+ similarity)<br>
                • <strong>Partial Matches</strong>: Products found but with some field discrepancies<br>
                • <strong>Missed Products</strong>: Products in the benchmark that weren't extracted from the document<br>
                • <strong>False Positives</strong>: Extracted products that don't exist in the benchmark (duplicates, errors, etc.)
              </div>
            </div>

            <!-- Field-Level Accuracy -->
            <div class="modal-section">
              <h3><span>🎯</span> Field-Level Accuracy</h3>
              <div class="field-accuracy">
                ${Object.entries(analysis.fieldAccuracy || {})
                  .map(
                    ([field, accuracy]) => `
                  <div class="field-row">
                    <div class="field-name">${field}</div>
                    <div class="field-score ${getMetricClass(accuracy)}">${accuracy.toFixed(1)}%</div>
                    <div class="field-bar">
                      <div class="field-bar-fill" style="width: ${accuracy}%; background: ${getFieldBarColor(accuracy)};"></div>
                    </div>
                  </div>
                `
                  )
                  .join('')}
              </div>
              
              <div class="explanation-box">
                <strong>Field Accuracy Explained:</strong><br>
                For each field (SKU, product name, price, etc.), this shows the percentage of products where the extracted value exactly matches the benchmark value. Low scores indicate systematic extraction errors for that specific field.
              </div>
            </div>

            <!-- Quality Issues -->
            ${
              analysis.qualityIssues && analysis.qualityIssues.length > 0
                ? `
            <div class="modal-section">
              <h3><span>⚠️</span> Quality Issues Detected</h3>
              <div class="quality-issues">
                <strong>Issues found (${analysis.qualityIssues.length}):</strong>
                <ul>
                  ${analysis.qualityIssues.map((issue) => `<li>${issue}</li>`).join('')}
                </ul>
              </div>
            </div>
            `
                : ''
            }

            <!-- Action Buttons -->
            <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e9ecef; text-align: center;">
              <button onclick="downloadGradingResults('${runId}', '${runData.vendor_name}')" class="success">
                ⬇️ Download Full Report (JSON)
              </button>
              <button onclick="closeGradingModal()" class="secondary" style="margin-left: 10px;">
                Close
              </button>
            </div>
          `;

          // Show modal
          document.getElementById('gradingModal').classList.add('active');
        } catch (error) {
          alert(`Error loading grading results: ${error.message}`);
        }
      }

      function getMetricClass(score) {
        if (score >= 80) return 'excellent';
        if (score >= 60) return 'good';
        if (score >= 40) return 'fair';
        return 'poor';
      }

      function getFieldBarColor(score) {
        if (score >= 80) return 'linear-gradient(90deg, #28a745, #20c997)';
        if (score >= 60) return 'linear-gradient(90deg, #20c997, #17a2b8)';
        if (score >= 40) return 'linear-gradient(90deg, #ffc107, #fd7e14)';
        return 'linear-gradient(90deg, #dc3545, #c82333)';
      }

      function closeGradingModal() {
        document.getElementById('gradingModal').classList.remove('active');
      }

      // Close modal when clicking outside
      document.addEventListener('click', (e) => {
        const modal = document.getElementById('gradingModal');
        if (e.target === modal) {
          closeGradingModal();
        }
      });

      // Download grading results as JSON
      async function downloadGradingResults(runId, vendorName) {
        const baseUrl = getFunctionAppUrl();

        try {
          const response = await fetch(
            `${baseUrl}/api/documents?resultId=${encodeURIComponent(runId)}`
          );

          if (!response.ok) {
            alert('Failed to load run data');
            return;
          }

          const results = await response.json();
          if (!results || results.length === 0) {
            alert('Run not found');
            return;
          }

          const runData = results[0];

          if (!runData.grading_results || !runData.grading_analysis) {
            alert('No grading results available for this run');
            return;
          }

          // Create complete grading report
          const gradingReport = {
            runId: runId,
            vendorName: vendorName,
            documentName: runData.document_name,
            gradedAt: runData.graded_at,
            metrics: JSON.parse(runData.grading_results),
            analysis: JSON.parse(runData.grading_analysis),
          };

          // Create download link
          const blob = new Blob([JSON.stringify(gradingReport, null, 2)], {
            type: 'application/json',
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `grading-report-${vendorName}-${runId.substring(0, 8)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          alert('✅ Grading report downloaded successfully!');
        } catch (error) {
          alert(`Error downloading grading results: ${error.message}`);
        }
      }
    </script>

    <!-- Grading Results Modal -->
    <div id="gradingModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2><span>📊</span> Benchmark Grading Results</h2>
          <button class="modal-close" onclick="closeGradingModal()">&times;</button>
        </div>
        <div class="modal-body" id="gradingModalBody">
          <!-- Content will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </body>
</html>
